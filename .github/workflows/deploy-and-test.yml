name: Web Deployment and Live Selenium E2E Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    outputs:
      page_url: "https://Suresh595817.github.io/MuscleIq/"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Dependencies
        working-directory: Web
        run: npm ci

      - name: Build React App
        working-directory: Web
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./Web/dist
          destination_dir: ./

  run-selenium-tests:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Wait for GitHub Pages Deployment Propagation
        run: sleep 30

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Selenium and Pytest
        run: |
          pip install selenium pytest pytest-html openpyxl pandas

      - name: Execute 300 Selenium E2E Tests against LIVE site
        working-directory: QA/selenium_tests
        run: |
          echo "Testing against LIVE URL: ${{ needs.build-and-deploy.outputs.page_url }}"
          pytest test_massive_factory.py --html=reports/execution-report.html || true

      - name: Upload Test Reports and Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Selenium-Web-Reports
          path: |
            QA/selenium_tests/reports/
          retention-days: 30

      - name: Publish GitHub Action Summary
        if: always()
        run: |
          echo "# Live GitHub Pages E2E Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment URL:** ${{ needs.build-and-deploy.outputs.page_url }}" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Total Test Cases:** 300" >> $GITHUB_STEP_SUMMARY

  run-load-tests:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas openpyxl

      - name: Execute 300 Load Tests
        working-directory: QA
        run: python custom_load_test.py || true

      - name: Upload Load Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Load-Test-Reports
          path: QA/reports/
          retention-days: 30

  run-vulnerability-tests:
    needs: build-and-deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests pandas openpyxl

      - name: Execute 300 Vulnerability Tests
        working-directory: QA
        run: python vulnerability_test.py || true

      - name: Upload Vulnerability Test Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Vulnerability-Reports
          path: QA/reports/
          retention-days: 30
