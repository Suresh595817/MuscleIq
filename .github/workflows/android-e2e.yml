name: Enterprise Android Appium E2E Automation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Fix GITHUB_TOKEN permissions for GitHub Pages deployment
permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: macos-13 # Explicitly use Intel Mac (x86_64) for Android Emulator compatibility
    timeout-minutes: 120

    steps:
      # Stage 1: Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Stage 2: Setup Java
      - name: Setup Java JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'
          # FIX: Specify the exact path to pom.xml since it is not in the root directory!
          cache-dependency-path: 'QA/automation/pom.xml'

      # Stage 5: Build APK
      - name: Build Android Debug APK
        working-directory: Android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # Stage 9: Install Node and Appium
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          
      - name: Install and Start Appium Server
        run: |
          npm install -g appium
          appium driver install uiautomator2
          appium &
          sleep 5

      # Stage 6, 7, 8, 10, 11, 12, 13, 14, 15, 16: Start Emulator and Execute Tests
      - name: Run Appium Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: default
          arch: x86_64
          profile: pixel_4
          script: |
            echo "Emulator started, installing APK..."
            adb install Android/app/build/outputs/apk/debug/app-debug.apk
            echo "Running Maven TestNG Suite (400+ Tests)..."
            cd QA/automation
            mvn clean test -Dsurefire.suiteXmlFiles=src/test/resources/testng.xml || true

      # Stage 18: Upload Artifacts
      - name: Upload Test Reports and Logs
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Automation-Reports
          path: |
            QA/automation/reports/
            QA/automation/screenshots/
          retention-days: 30

      # Stage 17 & 21: Publish GitHub Action Summary
      - name: Generate Action Summary
        if: always()
        run: |
          echo "# Android Appium E2E Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Execution Date:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Please check the **Artifacts** below for the detailed Excel/HTML reports." >> $GITHUB_STEP_SUMMARY
          
      # Stage 19: Publish Reports to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: always()
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./QA/automation/reports
          destination_dir: reports/latest
